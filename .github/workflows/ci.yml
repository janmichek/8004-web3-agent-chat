name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck:all
      - run: npm run lint
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:offline
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

  # Full browser matrix (chromium + firefox + webkit + mobile) on main only.
  # PRs stay fast on chromium; main catches Safari/Firefox wallet regressions.
  # Local full run: PLAYWRIGHT_MATRIX=all npm run test:e2e:matrix
  e2e-matrix:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run test:e2e:matrix
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-matrix-report
          path: |
            playwright-report/
            test-results/
