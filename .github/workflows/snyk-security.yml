# Snyk Code (SAST) + Open Source (SCA). Needs a Snyk API token:
# add it as the repository secret SNYK_TOKEN (https://docs.snyk.io/snyk-cli/authenticate-the-cli-with-your-account).
# Without the secret every step is skipped, so the workflow stays green instead of failing with 401.

name: Snyk Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  snyk:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Skip notice
        if: ${{ env.SNYK_TOKEN == '' }}
        run: echo "SNYK_TOKEN secret is not set; skipping Snyk scans."
      - uses: actions/checkout@v4
        if: ${{ env.SNYK_TOKEN != '' }}
      - uses: actions/setup-node@v4
        if: ${{ env.SNYK_TOKEN != '' }}
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: ${{ env.SNYK_TOKEN != '' }}
      - name: Set up Snyk CLI
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: snyk/actions/setup@806182742461562b67788a64410098c9d9b96adb
      # Snyk Code (SAST); results go to the GitHub Code Scanning tab.
      - name: Snyk Code test
        if: ${{ env.SNYK_TOKEN != '' }}
        run: snyk code test --sarif-file-output=snyk-code.sarif
        continue-on-error: true
      - name: Upload result to GitHub Code Scanning
        if: ${{ env.SNYK_TOKEN != '' && hashFiles('snyk-code.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-code.sarif
      # Snyk Open Source (SCA): fail the check on high-severity dependency issues.
      - name: Snyk Open Source test
        if: ${{ env.SNYK_TOKEN != '' }}
        run: snyk test --severity-threshold=high
