<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Agent + earn mark (dark plate for tab / dark UI) -->
  <rect width="32" height="32" rx="8" fill="#0F1720"/>
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#plate)"/>
  <!-- antenna -->
  <path d="M16 5V3" stroke="#6EE7B7" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="16" cy="2.15" r="1.3" fill="#34D399"/>
  <!-- head -->
  <rect x="9.25" y="5.6" width="13.5" height="10.4" rx="3.4" fill="#EEF3F8"/>
  <!-- eyes -->
  <circle cx="13.2" cy="10.15" r="1.65" fill="#0B1218"/>
  <circle cx="18.8" cy="10.15" r="1.65" fill="#0B1218"/>
  <circle cx="13.55" cy="9.8" r="0.5" fill="#fff"/>
  <circle cx="19.15" cy="9.8" r="0.5" fill="#fff"/>
  <!-- mouth -->
  <path d="M13.1 13.35c.85.7 1.85 1.05 2.9 1.05s2.05-.35 2.9-1.05" stroke="#94A3B8" stroke-width="1.15" stroke-linecap="round"/>
  <!-- body -->
  <rect x="10.1" y="16.5" width="11.8" height="9" rx="2.9" fill="#D7E0EA"/>
  <!-- chest core -->
  <circle cx="16" cy="20.15" r="1.55" fill="#28A0F0"/>
  <circle cx="16" cy="20.15" r="0.7" fill="#CDEBFF"/>
  <!-- earn coin -->
  <circle cx="24.35" cy="24.35" r="5.15" fill="#0F1720"/>
  <circle cx="24.35" cy="24.35" r="4.4" fill="#10B981"/>
  <circle cx="24.35" cy="24.35" r="3" fill="none" stroke="#A7F3D0" stroke-width="1"/>
  <text x="24.35" y="26.15" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="6.2" font-weight="800" fill="#ECFDF5">$</text>
  <defs>
    <radialGradient id="plate" cx="50%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#1A2836"/>
      <stop offset="100%" stop-color="#0F1720"/>
    </radialGradient>
  </defs>
</svg>
